title:
  *: hksagentur.schema.page.article.title

icon: bookmark

num: "{{ page.created.toDate('Ymd') }}"

image:
  query: page.cover.toFile
  ratio: 3/2
  cover: true

create:
  fields:
    - created

tabs:
  content:
    extends: schema/tabs/content
    columns:
      main:
        fields:
          blocks: schema/fields/blocks
      sidebar:
        sections:
          meta: schema/sections/meta
          taxonomies: schema/sections/taxonomies
  media: schema/tabs/media
