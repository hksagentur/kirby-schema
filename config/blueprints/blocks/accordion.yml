name:
  *: hksagentur.schema.block.accordion.name
label: "{{ title }}"
icon: bars
tabs:
  content:
    extends: schema/tabs/content
    fields:
      level:
        extends: schema/fields/heading-level
        default: h2
      title: schema/fields/heading
      text: schema/fields/inline-text
      items:
        type: blocks
        label:
          *: hksagentur.schema.block.accordion.label
        empty:
          *: hksagentur.schema.block.accordion.empty
        required: true
        fieldsets:
          - accordion-item