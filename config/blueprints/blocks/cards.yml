name:
  *: hksagentur.schema.block.cards.name
label: "{{ title }}"
icon: layers
tabs:
  content:
    extends: schema/tabs/content
    fields:
      level:
        extends: schema/fields/heading-level
        default: h2
      title: schema/fields/heading
      eyebrow: schema/fields/eyebrow
      text: schema/fields/inline-text
      link:
        type: object
        fields:
          extends: schema/fields/link
      cards:
        type: blocks
        label:
          *: hksagentur.schema.block.cards.label
        empty:
          *: hksagentur.schema.block.cards.empty
        required: true
        fieldsets:
          - card