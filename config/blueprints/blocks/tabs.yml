name:
  *: hksagentur.schema.block.tabs.name
label: "{{ title }}"
icon: grid-bottom
tabs:
  content:
    extends: schema/tabs/content
    fields:
      level:
        extends: schema/fields/heading-level
        default: h2
      title: schema/fields/heading
      text: schema/fields/inline-text
      tabs:
        type: structure
        label:
          *: hksagentur.schema.block.tabs.tabs
        fields:
          title:
            extends: schema/fields/heading
            required: true
          layout:
            extends: schema/fields/content-layout
            required: true
          open:
            extends: schema/fields/open
            default: false
        columns:
          title: true
          open: true
        required: true
        batch: true