name:
  *: hksagentur.schema.block.mediaText.name
label: "{{ title }}"
icon: layout-columns
tabs:
  content:
    extends: schema/tabs/content
    fields:
      level:
        extends: schema/fields/heading-level
        default: h2
      title: schema/fields/heading
      eyebrow: schema/fields/eyebrow
      text: schema/fields/rich-text
      link:
        type: object
        fields:
          extends: schema/fields/link
      media: schema/fields/media
  settings:
    extends: schema/tabs/settings
    fields:
      alignment: schema/fields/align-content
      reverse: schema/fields/reverse