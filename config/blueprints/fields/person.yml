type: group
fields:
  extends: @hksagentur/schema/fields/name
  description:
    extends: @hksagentur/schema/fields/inline-text
    label:
      *: hksagentur.schema.field.person.description
  lineContact:
    type: line
  email: @hksagentur/schema/fields/email
  telephone: @hksagentur/schema/fields/telephone
  fax: @hksagentur/schema/fields/fax
  jobTitle:
    type: text
    label:
      *: hksagentur.schema.field.person.jobTitle
    counter: false
  qualifications: @hksagentur/schema/fields/qualifications
  expertise: @hksagentur/schema/fields/expertise