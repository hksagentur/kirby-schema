type: group
fields:
  title:
    type: text
    label:
      *: hksagentur.schema.field.link.title
    counter: false
  url:
    type: link
    label:
      *: hksagentur.schema.field.link.url
    required: true
    options:
      - page
      - url
      - anchor
      - email
      - tel
  target:
    type: toggles
    label:
      *: hksagentur.schema.field.link.target.label
    default: _self
    options:
      - value: _self
        text:
          *: hksagentur.schema.field.link.target.self
      - value: _blank
        text:
          *: hksagentur.schema.field.link.target.blank
      - value: _parent
        text:
          *: hksagentur.schema.field.link.target.parent
      - value: _top
        text:
          *: hksagentur.schema.field.link.target.top
  rel:
    type: select
    label:
      *: hksagentur.schema.field.link.rel
    options:
      alternate: Alternate
      author: Author
      bookmark: Bookmark
      help: Help
      home: Home
      license: License
      me: Me
      next: Next
      prev: Prev
      tag: Tag
      search: Search
      privacy-policy: Privacy Policy
      terms-of-service: Terms of Service