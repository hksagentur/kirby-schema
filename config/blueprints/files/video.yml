title:
  *: hksagentur.schema.file.video.title

accept:
  type: video

image:
  query: model.poster.toFile
  ratio: 16/9
  cover: false

columns:
  main:
    width: 2/3
    fields:
      label:
        extends: schema/fields/heading
        label:
          *: hksagentur.schema.file.video.label
      description:
        extends: schema/fields/inline-text
        label:
          *: hksagentur.schema.file.video.description
      poster: schema/fields/video-poster
      formats: schema/fields/video-formats
      subtitles: schema/fields/video-subtitles
      captions: schema/fields/video-captions
  sidebar:
    width: 1/3
    fields:
      author:
        type: text
        label:
          *: hksagentur.schema.file.video.author
        icon: user
        counter: false
      source:  schema/fields/source